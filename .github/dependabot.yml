version: 2
updates:
  # npm dependencies: weekly, with minor and patch updates grouped into a
  # single pull request so they are easy to review. Major versions arrive as
  # separate pull requests because they can contain breaking changes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types must match the Node version the site runs on (24, see .nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # @astrojs/check and typescript-eslint do not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    cooldown:
      default-days: 7

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    cooldown:
      default-days: 7
